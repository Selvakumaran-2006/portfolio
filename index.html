<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selva Kumaran G | Computer Science Engineering Fresher Portfolio</title>
    <meta name="description" content="Portfolio of Selva Kumaran G - Computer Science Engineering Fresher, MERN Stack Developer, Java Specialist, Patent Publisher." />
    
    <!-- Google Fonts: Space Grotesk (Headings) + Inter (Body) + Fira Code (Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Script with User Specified Color Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              themeBg: '#050816',
              themeSecondary: '#0B1026',
              themePurple: '#8B5CF6',
              themeNeonViolet: '#A855F7',
              themeBlue: '#3B82F6',
              themeCyan: '#22D3EE',
              themeMainText: '#F8FAFC',
              themeSecondaryText: '#94A3B8',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            boxShadow: {
              'neon-purple': '0 0 25px rgba(139, 92, 246, 0.4)',
              'neon-violet': '0 0 25px rgba(168, 85, 247, 0.5)',
              'neon-cyan': '0 0 25px rgba(34, 211, 238, 0.4)',
              'neon-blue': '0 0 25px rgba(59, 130, 246, 0.4)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#050816] text-[#F8FAFC] font-sans selection:bg-[#A855F7] selection:text-[#050816] overflow-x-hidden">
